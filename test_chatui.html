<!DOCTYPE html>
<html>
<head>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  html, body, #root {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #05070d;
  }
</style>
</head>
<body class="text-white user-select-none">
  <div id="root">
    <div class="w-full h-full relative font-sans overflow-hidden text-white bg-[#161618]">
      <div class="absolute inset-0 z-10">
        <div class="absolute inset-0 z-10 flex flex-col pt-[120px] transition-opacity duration-500">
          <!-- Messages Scroll Area -->
          <div class="flex-1 overflow-y-auto w-full px-4 md:px-8 pb-4">
            <div class="flex flex-col gap-6 w-full max-w-4xl mx-auto min-h-full pb-8 pt-4">
              <div class="flex flex-col items-center justify-center my-auto opacity-50 flex-1 border border-red-500">
                <p>Type a message to begin...</p>
              </div>
            </div>
          </div>
          
          <!-- Sticky Input Area -->
          <div class="w-full shrink-0 border-t px-4 py-4 md:py-6 backdrop-blur-xl bg-[#161618]/80 border-white/5 border border-green-500">
            <form class="flex items-end gap-2 p-1.5 rounded-3xl border bg-[#1e1e20] border-white/10">
              <input type="text" placeholder="Message Vayu..." class="flex-1 bg-transparent px-4 py-2 min-h-[44px] outline-none text-[15px] text-white">
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
