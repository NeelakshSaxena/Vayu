version: '3.8'

services:
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages

  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ../apps/api:/app/apps/api
      - ../services:/app/services
